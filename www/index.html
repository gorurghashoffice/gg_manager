<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>GG Manager</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap">
<style>
:root{--y:#F5C400;--bg:#FAF9F4;--tx:#1C1C1C;--cd:#FFFFFF;--bd:#E5E5E5;--mu:#6b6b63;--yt:#fff6cc;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171715;--tx:#f2f1ea;--cd:#222220;--bd:#3a3a36;--mu:#a5a59b;--yt:#3a3300}}
:root[data-theme="dark"]{--bg:#171715;--tx:#f2f1ea;--cd:#222220;--bd:#3a3a36;--mu:#a5a59b;--yt:#3a3300}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--tx);font:15px/1.5 'Hind Siliguri',system-ui,sans-serif}
.app{display:flex;min-height:100vh}
nav{width:220px;background:var(--cd);border-right:1px solid var(--bd);padding:14px 10px;position:sticky;top:0;height:100vh;flex-shrink:0}
.logo{display:flex;gap:10px;align-items:center;padding:4px 8px 16px;font-weight:700}
.mark{width:46px;height:46px;border-radius:10px;display:block}.ml{display:none;width:34px;height:34px;border-radius:8px;margin-right:8px;vertical-align:middle}@media(max-width:760px){.ml{display:inline-block}}
nav a{display:flex;gap:10px;align-items:center;padding:10px;border-radius:8px;cursor:pointer;color:var(--tx);margin-bottom:2px}
nav a.on{background:var(--yt);border-left:3px solid var(--y);font-weight:600}
main{flex:1;min-width:0;padding:18px 22px 80px;max-width:1100px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:8px}
h1{font-size:22px;margin:0}h2{font-size:17px;margin:0 0 10px}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.stat b{display:block;font-size:24px}.stat span{color:var(--mu)}
label{display:block;font-size:13px;color:var(--mu);margin-bottom:2px}
input,select,textarea{width:100%;padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--cd);color:var(--tx);font:inherit;min-height:40px}
.pair{display:grid;grid-template-columns:1fr 110px;gap:6px}
button{font:inherit;border:1px solid var(--bd);background:var(--cd);color:var(--tx);padding:9px 14px;border-radius:8px;cursor:pointer;min-height:40px}
button.p{background:var(--y);border-color:var(--y);color:#1C1C1C;font-weight:600}button.d{color:#b3261e}
:focus-visible{outline:2px solid var(--y);outline-offset:2px}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--bd);font-size:14px;vertical-align:top}th{color:var(--mu);font-weight:500}
.sc{overflow-x:auto}details{border:1px solid var(--bd);border-radius:10px;margin-bottom:10px;background:var(--cd)}summary{padding:10px 14px;font-weight:600;cursor:pointer}details>div{padding:0 14px 14px}
.tot{font-weight:700;background:var(--yt);padding:3px 8px;border-radius:6px;display:inline-block}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}.mu{color:var(--mu)}
img.pv{max-height:70px;border-radius:6px;margin-top:4px;display:block}
.bars{display:flex;gap:10px;align-items:flex-end;height:140px}.bars div{flex:1;text-align:center;font-size:12px}.bars i{display:block;background:var(--y);border-radius:4px 4px 0 0;min-height:2px}
.off{opacity:.5}
@media(max-width:760px){nav{position:fixed;bottom:0;top:auto;height:auto;width:100%;display:flex;border:0;border-top:1px solid var(--bd);padding:4px;z-index:5;padding-bottom:calc(4px + env(safe-area-inset-bottom,0px))}.logo{display:none}nav a{flex:1;flex-direction:column;gap:0;font-size:11px;padding:6px 2px;text-align:center;border-left:0!important}main{padding:14px 12px 90px}.pair{grid-template-columns:1fr 92px}}
</style></head><body>

function render(){
 $('#nav').innerHTML=`<div class="logo"><img class="mark" src="${LOGO}" alt="Gorur Ghash"><div>GG Manager<br><small class="mu">Gorur Ghash</small></div></div>`+NAV.map(([v,l,ic])=>`<a class="${v===view?'on':''}" onclick="go('${v}')"><span>${ic}</span><span>${t(l)}</span></a>`).join('');
 const m=$('#m');m.innerHTML=`<datalist id="pl">${db.prod.map(p=>`<option value="${esc(p.sku)}">`).join('')}</datalist><datalist id="sl">${db.shops.map(s=>`<option value="${esc(s.name)}">`).join('')}</datalist>`+({dash:vDash,fab:()=>vPur('fab'),acc:()=>vPur('acc'),prod:vProd,sku:vSku,set:vSet}[view])();
 if(view==='fab'||view==='acc')recalcAll();if(view==='prod')pcalc()}
function bar(){return `<div class="top"><h1><img class="ml" src="${LOGO}" alt="">${t(NAV.find(x=>x[0]===view)[1])}</h1><button onclick="db.lang=db.lang==='bn'?'en':'bn';save();render()">${db.lang==='bn'?'English':'বাংলা'}</button></div>`}
function vDash(){const F=sum(db.fab.map(p=>({v:ptot(p)})),'v'),A=sum(db.acc.map(p=>({v:ptot(p)+ptot(p,'d')})),'v');
 const mo={};[...db.fab,...db.acc].forEach(p=>{const k=p.date.slice(0,7);mo[k]=(mo[k]||0)+ptot(p)+ptot(p,'d')});const ks=Object.keys(mo).sort().slice(-6),mx=Math.max(1,...ks.map(k=>mo[k]));
 const rec=[...db.fab.map(p=>({...p,ty:'Fabric Purchase'})),...db.acc.map(p=>({...p,ty:'Accessories Purchase'}))].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,6);
 return `<div class="top"><div><h1><img class="ml" src="${LOGO}" alt="">${t('Welcome to GG Manager')}</h1></div><button onclick="db.lang=db.lang==='bn'?'en':'bn';save();render()">${db.lang==='bn'?'English':'বাংলা'}</button></div>
 <div class="grid">${[['Total Fabric Purchase',F],['Total Accessories Purchase',A],['Total Products',db.prod.length],['Total Purchase Amount',F+A]].map(([l,v])=>`<div class="card stat"><span>${t(l)}</span><b>${fm(v)}</b></div>`).join('')}</div>
 <div class="card"><h2>${t('Monthly Purchase')}</h2>${ks.length?`<div class="bars">${ks.map(k=>`<div><i style="height:${mo[k]/mx*100}px"></i>${k.slice(5)}/${k.slice(2,4)}<br>${fm(mo[k])}</div>`).join('')}</div>`:`<p class="mu">${t('No records yet')}</p>`}</div>
 <div class="card"><h2>${t('Recent Activity')}</h2><div class="sc"><table>${rec.map(r=>`<tr><td>${r.date}</td><td>${t(r.ty)}</td><td>${esc(r.shop.name)}</td><td>${fm(ptot(r)+ptot(r,'d'))}</td></tr>`).join('')||`<tr><td class="mu">${t('No records yet')}</td></tr>`}</table></div></div>`}
function vPur(kind){const L=db[kind];
 if(ed){const r=ed==='new'?{date:today(),items:[{}],shop:{}}:L.find(x=>x.id===ed),s=r.shop||{};
  return bar()+`<div class="card" data-kind="${kind}"><div class="g2">${fld('Date',`<input data-h="date" type="date" value="${r.date}">`)}${fld('Location',`<select data-h="loc">${opts('Location',r.loc)}</select>`)}${fld('Market',`<select data-h="mkt">${opts('Market',r.mkt)}</select>`)}${fld('Shop Name',`<input data-h="shopname" list="sl" value="${esc(s.name)}">`)}
  ${fld('Shop No',`<input data-h="sno" value="${esc(s.sno)}">`)}${fld('Shop Type',`<select data-h="stype">${opts('Shop Type',s.stype)}</select>`)}${fld('Contact Person',`<input data-h="cp" value="${esc(s.cp)}">`)}${fld('Contact Number',`<input data-h="cn" value="${esc(s.cn)}" inputmode="tel">`)}
  ${fld('Receipt / Challan',`<div id="rc"><input data-h="rc" type="file" accept="image/*" data-v="${esc(r.rc||'')}" onchange="this.dataset.v=''"><img class="pv" ${r.rc?`src="${esc(r.rc)}"`:'hidden'}></div>`)}</div></div>
  <div id="items" data-kind="${kind}">${r.items.map((o,i)=>item(kind,o,i)).join('')}</div>
  <div class="row"><button onclick="addIt('${kind}')">+ ${t(kind==='fab'?'Add Another Fabric':'Add Another Accessories')}</button></div>
  <div class="card">${kind==='fab'?`${t('Total')}: <span class="tot" id="gt1">0</span><span id="gt2" hidden></span><span id="gt" hidden></span>`:`${t('Total')}: <span class="tot" id="gt1">0</span> &nbsp; ${t('Total Dying Cost')}: <span class="tot" id="gt2">0</span> &nbsp; ${t('Grand Total')}: <span class="tot" id="gt">0</span>`}</div>
  <div class="row"><button class="p" onclick="savePur('${kind}')">${t('Save')}</button><button onclick="go('${kind}')">${t('Cancel')}</button></div>`}
 const q=(flt.q||'').toLowerCase(),rows=L.filter(r=>!q||JSON.stringify(r).toLowerCase().includes(q)).sort((a,b)=>b.date.localeCompare(a.date));
 return bar()+`<div class="row"><button class="p" onclick="go('${kind}','new')">+ ${t('New')}</button><input style="max-width:260px" placeholder="${t('Search')}" value="${esc(flt.q||'')}" oninput="flt.q=this.value;render();const i=$('#m input[placeholder]');i.focus();i.setSelectionRange(99,99)"></div>
 <div class="card sc"><table><tr><th>${t('Date')}</th><th>${t('Shop')}</th><th>${t('Location')}</th><th>${t('Items')}</th><th>${t('Total')}</th><th></th></tr>${rows.map(r=>`<tr><td>${r.date}</td><td>${esc(r.shop.name)}<br><small class="mu">${esc(r.shop.cp||'')} ${esc(r.shop.cn||'')}</small></td><td>${esc(r.loc||'')} ${esc(r.mkt||'')}</td><td>${r.items.map(i=>esc(i.sku||i.atype||'')).join(', ')}</td><td>${fm(ptot(r)+ptot(r,'d'))}</td><td style="white-space:nowrap"><button onclick="go('${kind}','${r.id}')">${t('Edit')}</button> <button class="d" onclick="del('${kind}','${r.id}')">✕</button></td></tr>`).join('')||`<tr><td colspan=6 class="mu">${t('No records yet')}</td></tr>`}</table></div>`}
function addIt(kind){$('#items').insertAdjacentHTML('beforeend',item(kind,{},$$('.it').length));recalcAll()}
document.addEventListener('click',e=>{if(e.target.dataset.rm!==undefined){e.target.closest('.it').remove();$$('.it .no').forEach((s,i)=>s.textContent=i+1);recalcAll()}});
function savePur(kind){const sn=gv('shopname').trim();if(!sn)return alert(t('Shop Name'));
 const rc=$('[data-h="rc"]').dataset.v||'';const shop={name:sn,sno:gv('sno'),stype:gv('stype'),cp:gv('cp'),cn:gv('cn')};
 const items=$$('.it').map(e=>{const o=col(e),r=calc(e);o.tot=r.tot||0;if(kind==='fab')o.est=r.est||0;else o.dyt=r.est||0;return o});
 const rec={id:ed==='new'?uid():ed,date:gv('date'),loc:gv('loc'),mkt:gv('mkt'),shop,rc,items};
 const i=db.shops.findIndex(s=>s.name===sn);i<0?db.shops.push({...shop}):db.shops[i]={...db.shops[i],...shop};
 const L=db[kind],j=L.findIndex(x=>x.id===rec.id);j<0?L.push(rec):L[j]=rec;save();go(kind)}
function del(kind,id){if(confirm(t('Delete this record?'))){db[kind]=db[kind].filter(x=>x.id!==id);save();render()}}
const gcd=(a,b)=>b?gcd(b,a%b):a;
function crow(o={}){return `<tr class="cr"><td><select data-k="size">${opts('Size',o.size)}</select></td><td><input data-k="q" type="number" value="${esc(o.q)}"></td><td><button class="d" onclick="this.closest('tr').remove();pcalc()">✕</button></td></tr>`}
function rrow(o={}){return `<tr class="rq"><td><select data-k="type">${opts('Requirement Type',o.type)}</select></td><td><input data-k="qty" type="number" step="any" value="${esc(o.qty)}"></td><td><select data-k="unit">${opts('Requirement Unit',o.unit)}</select></td><td class="need mu"></td><td><button class="d" onclick="this.closest('tr').remove()">✕</button></td></tr>`}
function vProd(){
 if(ed){const p=ed==='new'?{cr:[{},{}],rq:[{}]}:db.prod.find(x=>x.id===ed);
  return bar()+`<div class="card" id="prodf"><div class="g2">${fld('Product SKU',inp('sku',p.sku))}${fld('Picture',img('pic',p.pic||''))}${fld('Type',sel('Product Type','ptype',p.ptype))}${fld('Style Name',inp('style',p.style))}${fld('Fabric SKU',inp('fsku',p.fsku))}${fld('Gender',sel('Gender','gender',p.gender))}${fld('Weight (g)',inp('wt',p.wt,'number'))}${fld('Consumption',`<div class="pair">${inp('cons',p.cons,'number')}${sel('Consumption Unit','cu',p.cu)}</div>`)}</div></div>
  <div class="card"><h2>${t('Cutting Ratio')}</h2><table id="crt"><tr><th>${t('Size')}</th><th>${t('Qty')}</th><th></th></tr>${p.cr.map(crow).join('')}</table><div class="row"><button onclick="$('#crt').insertAdjacentHTML('beforeend',crow());pcalc()">+ ${t('Add Size')}</button></div><div id="crs" class="mu"></div></div>
  <div class="card"><h2>${t('Accessories Requirement')}</h2><table id="rqt"><tr><th>${t('Type')}</th><th>${t('Per product')}</th><th>${t('Unit')}</th><th></th><th></th></tr>${p.rq.map(rrow).join('')}</table><div class="row"><button onclick="$('#rqt').insertAdjacentHTML('beforeend',rrow())">+ ${t('Add Another Accessories')}</button></div>
  <div class="row"><label>${t('Production Qty')}</label><input id="pq" type="number" style="max-width:140px" oninput="pcalc()"></div></div>
  <div class="row"><button class="p" onclick="saveProd()">${t('Save')}</button><button onclick="go('prod')">${t('Cancel')}</button></div>`}
 return bar()+`<div class="row"><button class="p" onclick="go('prod','new')">+ ${t('New')}</button></div><div class="grid">${db.prod.map(p=>`<div class="card">${p.pic?`<img class="pv" src="${esc(p.pic)}">`:''}<b>${esc(p.sku)}</b> <span class="mu">${esc(p.ptype||'')}</span><br>${esc(p.style||'')}<br><span class="mu">${t('Total')}: ${p.cr.reduce((a,c)=>a+n(c.q),0)} PCS</span><div class="row"><button onclick="go('prod','${p.id}')">${t('Edit')}</button><button onclick="go('sku');flt.q='${esc(p.sku)}';render()">SKU</button><button class="d" onclick="del('prod','${p.id}')">✕</button></div></div>`).join('')||`<p class="mu">${t('No records yet')}</p>`}</div>`}
function ratio(cr){const q=cr.filter(c=>c.size&&n(c.q)>0),g=q.reduce((a,c)=>gcd(a,n(c.q)),0);return q.length?{lab:q.map(c=>c.size).join(' : '),qs:q.map(c=>n(c.q)).join(' : '),r:q.map(c=>n(c.q)/g).join(' : '),tot:q.reduce((a,c)=>a+n(c.q),0)}:null}
function pcalc(){const cr=$$('.cr').map(col),r=ratio(cr),s=$('#crs');if(!s)return;s.innerHTML=r?`${t('Total')}: <b>${r.tot} PCS</b><br>${r.lab}<br>${r.qs}<br>${t('Cutting Ratio')}: <b>${r.r}</b>`:'';
 const pq=n(($('#pq')||{}).value);$$('.rq').forEach(e=>{const c=col(e);e.querySelector('.need').textContent=pq&&n(c.qty)?`${fm(n(c.qty)*pq)} ${c.unit||''}`:''})}
function saveProd(){const p=col($('#prodf'));if(!p.sku.trim())return alert(t('Product SKU'));p.sku=p.sku.trim();p.cr=$$('.cr').map(col).filter(c=>c.size||c.q);p.rq=$$('.rq').map(col).filter(c=>c.type);p.id=ed==='new'?uid():ed;const j=db.prod.findIndex(x=>x.id===p.id);j<0?db.prod.push(p):db.prod[j]=p;save();go('prod')}
function sec(title,body){return `<details open><summary>${t(title)}</summary><div class="sc">${body}</div></details>`}
const ph=(r,o)=>`${r.date}</td><td>${esc(r.loc||'')} ${esc(r.mkt||'')}</td><td>${esc(r.shop.name)} #${esc(r.shop.sno||'')}</td><td>${esc(r.shop.cp||'')} ${esc(r.shop.cn||'')}`;
function vSku(){const q=(flt.q||'').trim(),Q=q.toLowerCase();let h=bar()+`<div class="card"><div class="row"><input id="sq" style="flex:1" list="pl" placeholder="${t('Enter Product SKU / Fabric SKU')}" value="${esc(q)}" onkeydown="if(event.key==='Enter')doS()"><button class="p" onclick="doS()">${t('Search')}</button></div></div>`;if(!q)return h;
 const ps=new Set(db.prod.filter(p=>p.sku.toLowerCase()===Q||(p.fsku||'').toLowerCase()===Q).map(p=>p.sku));
 db.fab.forEach(r=>r.items.forEach(i=>{if((i.sku||'').toLowerCase()===Q&&i.psku)ps.add(i.psku);if((i.psku||'').toLowerCase()===Q)ps.add(i.psku)}));db.acc.forEach(r=>r.items.forEach(i=>{if((i.psku||'').toLowerCase()===Q)ps.add(i.psku)}));
 const prods=db.prod.filter(p=>ps.has(p.sku)),fs=new Set([Q]);prods.forEach(p=>p.fsku&&fs.add(p.fsku.toLowerCase()));db.fab.forEach(r=>r.items.forEach(i=>{if(ps.has(i.psku))fs.add((i.sku||'').toLowerCase())}));
 const fl=[],al=[];db.fab.forEach(r=>r.items.forEach(i=>{if(fs.has((i.sku||'').toLowerCase())||ps.has(i.psku))fl.push([r,i])}));db.acc.forEach(r=>r.items.forEach(i=>{if(ps.has(i.psku))al.push([r,i])}));
 if(!prods.length&&!fl.length&&!al.length)return h+`<p class="mu">${t('Not found')}: ${esc(q)}</p>`;
 const pic=s=>s?`<img class="pv" src="${esc(s)}">`:'';
 h+=prods.map(p=>{const r=ratio(p.cr);return sec('Product Information',`<div class="row">${pic(p.pic)}<div><b>${esc(p.sku)}</b> — ${esc(p.style||'')}<br>${esc(p.ptype||'')} / ${esc(p.gender||'')} / ${esc(p.wt||'')} g<br>${t('Fabric SKU')}: ${esc(p.fsku||'')}<br>${t('Consumption')}: ${esc(p.cons||'')} ${esc(p.cu||'')}</div></div>${r?`<p>${r.lab}<br>${r.qs}<br>${t('Cutting Ratio')}: <b>${r.r}</b> &nbsp; ${t('Total')}: <b>${r.tot} PCS</b></p>`:''}`)+sec('Accessories Requirement',`<table><tr><th>${t('Type')}</th><th>${t('Per product')}</th><th>${t('Unit')}</th></tr>${p.rq.map(c=>`<tr><td>${esc(c.type)}</td><td>${esc(c.qty)}</td><td>${esc(c.unit)}</td></tr>`).join('')}</table>`)}).join('');
 const seen=new Set();h+=sec('Fabric Details',`<table><tr><th></th><th>SKU</th><th>${t('Fabric Type')}</th><th>${t('Composition')}</th><th>GSM</th><th>${t('Width')}</th><th>${t('Color')}</th><th>${t('Consumption')}</th><th>${t('Est. Product Qty')}</th></tr>${fl.filter(([r,i])=>!seen.has(i.sku)&&seen.add(i.sku)).map(([r,i])=>`<tr><td>${pic(i.pic)}</td><td>${esc(i.sku)}</td><td>${esc(i.ftype)}</td><td>${esc(i.comp)}</td><td>${esc(i.gsm)}</td><td>${esc(i.width)}</td><td>${esc(i.color)}</td><td>${esc(i.cons)} ${esc(i.cu)}</td><td>${fm(i.est||0)}</td></tr>`).join('')}</table>`);
 h+=sec('Fabric Purchase History',`<table><tr><th>${t('Date')}</th><th>${t('Location')}</th><th>${t('Shop')}</th><th>${t('Contact Person')}</th><th>SKU</th><th>${t('Quantity')}</th><th>${t('Price')}</th><th>${t('Total')}</th><th>${t('Receipt / Challan')}</th></tr>${fl.map(([r,i])=>`<tr><td>${ph(r)}</td><td>${esc(i.sku)}</td><td>${esc(i.qty)} ${esc(i.qu)}</td><td>${esc(i.price)}/${esc(i.pu)}</td><td>${fm(i.tot||0)}</td><td>${pic(r.rc)}</td></tr>`).join('')}</table>`);
 h+=sec('Accessories Purchase History',`<table><tr><th>${t('Date')}</th><th>${t('Location')}</th><th>${t('Shop')}</th><th>${t('Contact Person')}</th><th></th><th>${t('Type')}</th><th>${t('Color')}</th><th>${t('Quantity')}</th><th>${t('Price')}</th><th>${t('Total')}</th><th>${t('Dying')}</th><th>${t('Receipt / Challan')}</th></tr>${al.map(([r,i])=>`<tr><td>${ph(r)}</td><td>${pic(i.pic)}</td><td>${esc(i.atype)}</td><td>${esc(i.color)}</td><td>${esc(i.qty)} ${esc(i.qu)}</td><td>${esc(i.price)}/${esc(i.pu)}</td><td>${fm(i.tot||0)}</td><td>${i.dy==='Yes'?fm(i.dyt||0):'—'}</td><td>${pic(r.rc)}</td></tr>`).join('')}</table>`);
 const F=fl.reduce((a,[r,i])=>a+(i.tot||0),0),A=al.reduce((a,[r,i])=>a+(i.tot||0),0),Dy=al.reduce((a,[r,i])=>a+(i.dyt||0),0);
 return h+`<div class="card"><div class="grid">${[['Total Fabric Purchase',F],['Total Accessories Purchase',A],['Total Dying Cost',Dy],['Total Purchase Cost',F+A+Dy]].map(([l,v])=>`<div class="stat"><span>${t(l)}</span><b>${fm(v)}</b></div>`).join('')}</div></div>`}
function doS(){flt.q=$('#sq').value;render()}
function vSet(){const c=flt.c||'Quantity Unit',L=db.dd[c]||[],sq=(flt.s||'').toLowerCase();
 return bar()+`<div class="card"><h2>${t('Language')}</h2><div class="row"><button class="${db.lang==='bn'?'p':''}" onclick="db.lang='bn';save();render()">বাংলা</button><button class="${db.lang==='en'?'p':''}" onclick="db.lang='en';save();render()">English</button></div></div>
 <div class="card"><h2>${t('Dropdown Management')}</h2><div class="g2"><div><label>${t('Category')}</label><select onchange="flt.c=this.value;render()">${Object.keys(db.dd).map(k=>`<option ${k===c?'selected':''}>${k}</option>`).join('')}</select></div><div><label>${t('Search')}</label><input id="so" value="${esc(flt.s||'')}" oninput="flt.s=this.value;render();const i=$('#so');i.focus();i.setSelectionRange(99,99)"></div><div><label>${t('Add option')}</label><div class="pair"><input id="no" onkeydown="if(event.key==='Enter')addO()"><button class="p" onclick="addO()">+</button></div></div></div>
 <div class="row">${L.map((o,i)=>({o,i})).filter(x=>x.o.v.toLowerCase().includes(sq)).map(({o,i})=>`<button class="${o.on?'':'off'}" onclick="db.dd['${c}'][${i}].on=${o.on?0:1};save();render()" title="${o.on?t('Active'):t('Inactive')}">${esc(o.v)} ${o.on?'✓':'⏸'}</button>`).join('')}</div></div>
 <div class="card"><h2>${t('Shops')}</h2><div class="sc"><table>${db.shops.map(s=>`<tr><td>${esc(s.name)}</td><td>${esc(s.sno||'')}</td><td>${esc(s.stype||'')}</td><td>${esc(s.cp||'')} ${esc(s.cn||'')}</td><td>${db.fab.concat(db.acc).filter(p=>p.shop.name===s.name).length} ${t('Purchase History')}</td></tr>`).join('')||`<tr><td class="mu">${t('No records yet')}</td></tr>`}</table></div></div>
 <div class="card row"><button onclick="exp()">${t('Backup (Export)')}</button><button onclick="$('#imp').click()">${t('Restore (Import)')}</button><input id="imp" type="file" accept=".json" hidden onchange="imp(this)"></div>`}
function addO(){const v=$('#no').value.trim(),c=flt.c||'Quantity Unit';if(v&&!db.dd[c].some(o=>o.v.toLowerCase()===v.toLowerCase())){db.dd[c].push({v,on:1});save()}render()}
function exp(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db)],{type:'application/json'}));a.download='gg-manager-backup.json';a.click()}
function imp(i){const r=new FileReader();r.onload=()=>{try{db={...db,...JSON.parse(r.result)};save();render()}catch(e){alert('Invalid file')}};r.readAsText(i.files[0])}
render();
</script></body></html>
